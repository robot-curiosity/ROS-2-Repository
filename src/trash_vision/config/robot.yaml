# Hardware parameters for the real robot. -1 / 0 / "" mean "not set yet":
# the node idles with a warning. TODO: Bryan to fill in every value below.
drive:
  ros__parameters:
    pwm_pins: [-1, -1]        # BCM, [left, right]
    dir_pins: [-1, -1]
    enc_a_pins: [-1, -1]
    enc_b_pins: [-1, -1]
    ticks_per_rev: 0.0
    wheel_radius_m: 0.0
    track_width_m: 0.0
ultrasonic:
  ros__parameters:
    trig_pins: [-1, -1, -1, -1, -1, -1, -1, -1]   # front_1..4, rear_1..4
    echo_pins: [-1, -1, -1, -1, -1, -1, -1, -1]
arm:
  ros__parameters:
    port: ""                  # e.g. /dev/ttyACM0
gps_imu:
  ros__parameters:
    gps_port: ""              # e.g. /dev/ttyAMA0
    gps_baud: 9600
    imu_model: ""             # "bno055" is the only backend so far
detector:
  ros__parameters:
    # Camera pose for ground projection: from CAD V16-18 per STATE.md, not
    # measured. TODO: Bryan to verify on the real robot.
    camera_x_m: 0.248
    camera_y_m: -0.1575
    camera_height_m: 0.642    # 0.582 m above base_link + 0.060 m wheel radius
    camera_pitch_deg: 35.0
    camera_hfov_deg: 66.0
    camera_vfov_deg: 41.0     # Camera Module 3 guess, check stream crop
