# Behaviour coordinator parameters.
#
# Values marked MEASURED come from docs/arm_workspace.md, which supersedes the
# provisional figures in the implementation plan. Where this file departs from
# that plan, the reason is given — the plan was written before the workspace
# sweep and Task 5b's correction.

/**:
  ros__parameters:
    # Which detector interface to consume. Change to "typed" once
    # trash_vision publishes drivebase_msgs/LitterDetection.
    detection_interface: "json_string"
    detection_topic: "/vision/target"

    camera_info_topic: "/pod_camera/camera_info"
    tof_topic: "/tof/pod"
    camera_optical_frame: "pod_camera_optical_frame"
    static_frame: "odom"
    arm_base_frame: "arm_base_link"

    tick_hz: 10.0

    # Patrol. Flattened [x, y, x, y, ...] in the static frame - ROS 2 params
    # have no nested-array type.
    waypoints: [2.0, 0.0, 4.0, 1.5, 2.0, 3.0, 0.0, 1.5]
    loop_patrol: true

    # Detection gating.
    min_confidence: 0.4
    deadband: 0.12
    detection_stale_after: 0.5

    # Confirmation gate. Fallback ranges are crude, so they need more frames.
    confirm_frames: 5
    confirm_frames_fallback: 10

    # ToF limits, matching the gpu_lidar in gazebo.xacro.
    tof_min_range: 0.04
    tof_max_range: 4.0

    # NOT MEASURED. The plan calls for one observation of a litter model at a
    # known distance; that observation has not been made. These are placeholders
    # and the fallback range they produce should not be trusted - which is
    # exactly why confirm_frames_fallback demands twice the evidence.
    fallback_reference_height_px: 60.0
    fallback_reference_range_m: 1.0

    # THE RANGE LOOP. Creeps the base during CONFIRMING until the target sits
    # in the middle of the radius span the arm can actually grasp at.
    #
    # There is no grasp window here any more, and that is the point. There used
    # to be `grasp_min`/`grasp_max` in CAMERA RANGE metres, carrying a flagged
    # unit mismatch: docs/arm_workspace.md measures the workspace from
    # base_link, the gate compared it against camera-to-target range, and the
    # two were reconciled by scaling along the beam at one pose. It never
    # constrained the quantity that decides whether a grasp is possible.
    # Measured cost: four targets confirmed in one run at grasp radii 0.200,
    # 0.039, 0.015 and 0.070 m against a reachable band of 0.075-0.198.
    #
    # The gate is now the arm's own IK against the URDF - the same two solves
    # the grasp sequence runs - and the band the base creeps toward is scanned
    # from that same model at startup. Nothing to keep in sync, nothing to
    # convert, and it follows the URDF if a link length changes.
    creep_gain: 0.6              # m/s per metre of radius error
    creep_max_speed: 0.08
    # The base does not move below this; reversing especially, since it drags.
    creep_min_speed: 0.03
    # Half-width of the settled window. Must stay well inside half the band
    # width, or the gate can never see a settled frame.
    creep_deadband: 0.020
    # Resolution of the startup radius scan. 2 mm against a band ~120 mm wide.
    radius_scan_step: 0.002

    # NOT USED. Superseded twice over - by approach_bbox_height_min for the
    # approach gate, then by the IK reachability test for the grasp gate. Kept
    # only so an existing params file does not fail to load.
    workspace_radius: 0.40

    # APPROACHING -> CONFIRMING gate: apparent bbox height as a fraction of
    # frame height. Proximity proxy, not a distance.
    #
    # Range cannot gate this. Through the approach the arm holds search_pose,
    # whose beam lands 1.168 m ahead of base_link, so the range read is the
    # distance to that ground point and stays near 1.0-1.1 m however close the
    # base gets. Measured over six approaches. The range only enters the grasp
    # window from confirm_pose, which is not adopted until CONFIRMING has been
    # entered - the gate was waiting on a measurement it made impossible.
    #
    # Derived, from the pinhole relation
    #     fraction = fy * object_height / (d * image_height)
    # with fy = 493.79 and image_height = 480 (both read from CameraInfo) and
    # the test-field can 0.070 m tall:
    #     fraction = 0.0720 / d
    # Targeting d = 0.333 m gives 0.216, rounded to 0.22. That 0.333 was the
    # old camera-range grasp_max; the gate it fed is gone, but the number is
    # still the right place to hand over - it is roughly where the target
    # becomes close enough for the range loop to creep the rest of the way.
    #
    # TWO CAVEATS, both real:
    #
    # 1. THIS CANNOT FIRE YET. Measured peak during an approach is 0.0792,
    #    i.e. the target is lost at d = 0.91 m - about 3x too far. The binding
    #    problem is not the gate, it is that nothing tracks the target: the arm
    #    is static through the approach so the litter drifts out of frame. The
    #    gate is correct and the tracking is missing.
    # 2. The calibration is object-size specific. It assumes 0.070 m tall
    #    litter. Real litter varies, so this proxy degrades on anything much
    #    larger or smaller. It gates the approach only - inside CONFIRMING the
    #    base still has to creep the target into the arm's reachable band and
    #    the IK still has to solve it before anything is grasped.
    approach_bbox_height_min: 0.22

    # Timeouts. Every one of these falls back to resuming the patrol.
    lost_timeout: 2.0
    approach_timeout: 30.0
    confirm_timeout: 8.0

    # Approach servo. linear_speed is never zero while correcting heading:
    # arcs, not point turns. RPP and the power budget both prefer arcs.
    #
    # (The plan also justified this by the base being unable to point-turn more
    # than once per run. That bug is fixed as of 2026-07-31 - see STATUS.md #1 -
    # so arcs are now a power and controller preference, not a workaround.)
    approach_linear_speed: 0.22
    approach_min_linear_speed: 0.06
    approach_angular_gain: 1.2
    approach_max_angular_speed: 0.8

    # Arm poses, [pan, lift, elbow, wrist_flex, wrist_roll, gripper].
    #
    # MEASURED. Search pose puts the pod's ground intersection at x = 1.168 m
    # ahead of base_link - far enough out to spot litter while driving.
    search_pose: [0.0, -1.4, 0.0, 0.4, 0.0, 0.0]
    # MEASURED, and this is a DEPARTURE FROM THE PLAN. The plan aimed the arm
    # from search_pose during CONFIRMING, but search_pose looks at ground
    # 1.168 m ahead - nowhere near the grasp window, so the range gate could
    # never have passed. Task 5b found this pose by sweeping the commanded joint
    # space: its beam lands at x = 0.392 m, inside the 0.287-0.481 m window,
    # with ToF 0.2716 m against a tf prediction of 0.2715 m.
    confirm_pose: [0.0, 0.9, 0.46, -1.40, 0.0, 0.0]
    stow_pose: [0.0, -1.20, 1.55, 1.10, 0.0, 0.0]

    # MEASURED off the collision meshes: the clear gap between the fixed
    # jaw's face and the moving jaw, over the height a 70 mm can occupies.
    # 15.8 mm at 0.0, 38.9 at 0.4, 64.1 at 0.8, 78.7 at 1.0, 89.2 at 1.1 -
    # and at 1.2 the moving jaw is ABOVE the can altogether. That is what the
    # old 1.2 did: it did not open the jaws, it lifted one clear of the
    # litter, so closing swept down onto the can rather than around it.
    # 1.0 clears the 66 mm can by 12.7 mm. 0.8 leaves 64.1 and clips it.
    gripper_open: 1.0
    gripper_closed: 0.0
    # Half the width of the litter being grasped. The grasp point is backed
    # off by this, because arm_gripper_frame_link sits on the fixed jaw's
    # face rather than between the jaws. 0.033 is the test field's can; the
    # detector does not report a size yet.
    grasp_object_radius: 0.033
    # The plane the jaws close on, metres above ground. Here rather than only
    # in the node's defaults because it is the one knob that trades reachable
    # band against how short a piece of litter can be gripped, and the answer
    # depends on what the field actually holds. The jaws' lowest material is
    # 6.4 mm below the frame this drives, so 0.040 puts the tips at 33.6 mm.
    # Lower than 0.038 the radial band collapses; see coordinator_node.py.
    grasp_height: 0.040
    # Metres straight up from the grasp point, solved by IK as its own pose so
    # the descent is vertical. Was a 0.35 rad shoulder_lift perturbation, which
    # swung the tip 105 mm outward and raked the jaws through the litter.
    grasp_approach_height: 0.060
    grasp_hold_seconds: 1.5

    # NOT MEASURED, and docs/arm_workspace.md explicitly declines to endorse it:
    # it is a harness-routing decision and there is no harness yet. The URDF
    # hard limit is -2.74385..+2.84121 rad. Keeping the plan's provisional 1.0
    # as the conservative choice.
    #
    # One thing IS measured and worth knowing: the pod hangs off arm_wrist_link,
    # upstream of wrist_roll, so sweeping wrist_roll -2.5..+2.5 rad moved the
    # ToF reading by under 2 mm. Rolling the wrist does not move the camera.
    wrist_roll_limit: 1.0

    # Straight down onto the litter.
    approach_angle: -1.5708
